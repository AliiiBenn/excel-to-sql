[project]
name = "excel-to-sql"
version = "0.1.0"
description = "CLI tool for importing Excel files to SQL and exporting back"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your@email.com" }
]
keywords = ["excel", "sql", "cli", "etl", "import", "export"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
    "sqlalchemy>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
excel-to-sql = "excel_to_sql.cli:app"

[project.urls]
Homepage = "https://github.com/yourusername/excel-to-sql"
Repository = "https://github.com/yourusername/excel-to-sql"
Issues = "https://github.com/yourusername/excel-to-sql/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["excel_to_sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
